<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 1440, &quot;height&quot;: 900},
  &quot;calmMode&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Behavior&quot;},
  &quot;ctaTarget&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;_blank&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;_blank&quot;, &quot;_self&quot;], &quot;section&quot;: &quot;Behavior&quot;}
}">
class Component extends DCLogic {
  setStarCanvas = (el) => { this.starCanvas = el; if (el) this.initStars(); };
  setParallaxBg = (el) => { this.parallaxEl = el; };
  setContentEl = (el) => { this.contentEl = el; };

  componentDidMount() {
    this.handleResize = () => { this.initStars(); };
    window.addEventListener('resize', this.handleResize);
    this.px = 0; this.py = 0; this.tx = 0; this.ty = 0;
    this.handleMouseMove = (e) => {
      this.tx = (e.clientX / window.innerWidth - 0.5) * 2;
      this.ty = (e.clientY / window.innerHeight - 0.5) * 2;
    };
    const parallaxLoop = () => {
      this.px += (this.tx - this.px) * 0.04;
      this.py += (this.ty - this.py) * 0.04;
      // Background/star layers sit deeper in Z and drift further — the negative
      // translateZ plus perspective is what sells the "receding into the scene" depth.
      if (this.parallaxEl) {
        this.parallaxEl.style.transform = `translate3d(${this.px * -26}px, ${this.py * -20}px, -80px) scale(1.09)`;
      }
      if (this.starCanvas) {
        this.starCanvas.style.transform = `translate3d(${this.px * -12}px, ${this.py * -9}px, -30px) scale(1.03)`;
      }
      // Foreground content tilts toward the cursor like a subtly-hinged panel,
      // and lifts slightly toward the viewer for the 3D "card" feel.
      if (this.contentEl) {
        this.contentEl.style.transform = `rotateX(${this.py * -3.5}deg) rotateY(${this.px * 4.5}deg) translateZ(14px)`;
      }
      this.parallaxRAF = requestAnimationFrame(parallaxLoop);
    };
    this.startParallax = () => {
      if (this.parallaxActive) return;
      this.parallaxActive = true;
      window.addEventListener('mousemove', this.handleMouseMove);
      this.parallaxRAF = requestAnimationFrame(parallaxLoop);
    };
    this.stopParallax = () => {
      if (!this.parallaxActive) return;
      this.parallaxActive = false;
      window.removeEventListener('mousemove', this.handleMouseMove);
      if (this.parallaxRAF) cancelAnimationFrame(this.parallaxRAF);
      this.px = 0; this.py = 0; this.tx = 0; this.ty = 0;
      if (this.parallaxEl) this.parallaxEl.style.transform = '';
      if (this.starCanvas) this.starCanvas.style.transform = '';
      if (this.contentEl) this.contentEl.style.transform = '';
    };
    // Mobile-first: the mouse-parallax loop only ever starts on desktop-sized,
    // real-pointer devices — phones/tablets never attach the listener or run the RAF loop.
    this.parallaxMQ = window.matchMedia('(min-width: 768px) and (hover: hover) and (pointer: fine)');
    this.syncParallax = () => { this.parallaxMQ.matches ? this.startParallax() : this.stopParallax(); };
    this.syncParallax();
    this.parallaxMQ.addEventListener('change', this.syncParallax);
  }

  componentDidUpdate(prevProps) {
    if (prevProps.calmMode !== this.props.calmMode) { this.initStars(); }
  }

  componentWillUnmount() {
    window.removeEventListener('resize', this.handleResize);
    this.stopParallax();
    this.parallaxMQ.removeEventListener('change', this.syncParallax);
    if (this.starRAF) cancelAnimationFrame(this.starRAF);
  }

  isReduced() {
    return window.matchMedia('(prefers-reduced-motion: reduce)').matches || !!this.props.calmMode;
  }

  initStars() {
    const canvas = this.starCanvas;
    if (!canvas) return;
    const parent = canvas.parentElement;
    const rect = parent.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const area = rect.width * rect.height;
    const count = Math.min(160, Math.max(60, Math.floor(area / 8000)));
    this.stars = Array.from({ length: count }, () => ({
      x: Math.random() * rect.width,
      y: Math.random() * rect.height,
      r: Math.random() * 1.3 + 0.3,
      phase: Math.random() * Math.PI * 2,
      speed: 0.2 + Math.random() * 0.4,
      driftX: (Math.random() - 0.5) * 0.012,
      driftY: (Math.random() - 0.5) * 0.008 + 0.006
    }));
    this.starW = rect.width;
    this.starH = rect.height;
    this.shootingStars = [];
    this.nextShootAt = -1;
    if (this.starRAF) cancelAnimationFrame(this.starRAF);
    if (this.isReduced()) { this.drawStars(0); return; }
    const loop = (t) => {
      this.drawStars(t);
      this.starRAF = requestAnimationFrame(loop);
    };
    this.starRAF = requestAnimationFrame(loop);
  }

  spawnShootingStar() {
    const angle = Math.random() * Math.PI * 2;
    const speed = 5 + Math.random() * 4;
    this.shootingStars.push({
      x: Math.random() * this.starW,
      y: Math.random() * this.starH,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      len: 50 + Math.random() * 50,
      age: 0,
      maxAge: 45 + Math.random() * 25
    });
  }

  updateShootingStars(ctx, t) {
    if (this.nextShootAt < 0) this.nextShootAt = t + 1500 + Math.random() * 2500;
    if (t >= this.nextShootAt && this.shootingStars.length < 2) {
      this.spawnShootingStar();
      this.nextShootAt = t + 2500 + Math.random() * 4500;
    }
    const w = this.starW, h = this.starH;
    this.shootingStars = this.shootingStars.filter((s) => s.age < s.maxAge && s.x > -80 && s.x < w + 80 && s.y > -80 && s.y < h + 80);
    for (const s of this.shootingStars) {
      s.x += s.vx; s.y += s.vy; s.age++;
      const fade = 1 - s.age / s.maxAge;
      const dist = Math.hypot(s.vx, s.vy) || 1;
      const ux = s.vx / dist, uy = s.vy / dist;
      const tailX = s.x - ux * s.len;
      const tailY = s.y - uy * s.len;
      const grad = ctx.createLinearGradient(tailX, tailY, s.x, s.y);
      grad.addColorStop(0, 'rgba(255,255,255,0)');
      grad.addColorStop(1, `rgba(255,255,255,${0.85 * fade})`);
      ctx.beginPath();
      ctx.moveTo(tailX, tailY);
      ctx.lineTo(s.x, s.y);
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.6;
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(s.x, s.y, 1.4, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${fade})`;
      ctx.fill();
    }
  }

  drawStars(t) {
    const ctx = this.starCanvas.getContext('2d');
    const w = this.starW, h = this.starH;
    ctx.clearRect(0, 0, w, h);
    for (const s of this.stars) {
      const tw = 0.5 + 0.5 * Math.sin(t * 0.0006 * s.speed * 3 + s.phase);
      const alpha = 0.15 + tw * 0.4;
      let dx = (s.x + t * s.driftX * 0.06) % (w + 20);
      if (dx < 0) dx += w + 20;
      let dy = (s.y + t * s.driftY * 0.06) % (h + 20);
      if (dy < 0) dy += h + 20;
      ctx.beginPath();
      ctx.arc(dx, dy, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,235,245,${alpha})`;
      ctx.fill();
    }
    if (!this.isReduced()) this.updateShootingStars(ctx, t);
  }

  renderVals() {
    return {
      ctaTarget: this.props.ctaTarget ?? '_blank',
      setStarCanvas: this.setStarCanvas,
      setParallaxBg: this.setParallaxBg,
      setContentEl: this.setContentEl
    };
  }
}
</script>
